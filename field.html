r;gap:8px;margin-top:13px}.big-action{min-height:56px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-weight:800;cursor:pointer;color:#284158}.big-action.done{background:#e5f6ef;border-color:#b6e2d1;color:#08734b}.big-action.mount.done{background:#dfeeff;border-color:#b5d4f2;color:#0c5e9f}.issue-row{display:flex;gap:8px;margin-top:8px}.issue-btn{width:100%;border:1px dashed #d7a6a6;border-radius:9px;background:#fff6f6;color:#a43535;padding:9px;font-weight:700;cursor:pointer}.issue-text{margin-top:8px;background:#fff0f0;color:#8e2929;border-radius:8px;padding:9px;font-size:12px}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.offline{background:#fff1d6;color:#7e5200;border:1px solid #f4d69a;border-radius:9px;padding:10px 12px;font-size:12px;margin-bottom:12px}dialog{border:0;border-radius:14px;width:min(440px,92vw);padding:0;box-shadow:0 24px 70px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(8,28,46,.55)}#settingsForm{padding:18px}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog-head h2{margin:0}.close{border:0;background:transparent;font-size:26px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}#settingsForm label{display:block;margin-top:13px;font-size:12px;font-weight:700}#settingsForm input,#settingsForm select{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}@media(min-width:700px){.field-main{padding-top:22px}.delivery{padding:17px}.big-action{font-size:16px}}

x;flex-wrap:wrap;gap:5px}.overview-delivery{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}.overview-delivery.done{background:#e5f6ef;border-color:#b6e2d1;color:#08734b}.overview-delivery.mount{background:#dfeeff;border-color:#b5d4f2;color:#0c5e9f}.overview-actions{display:flex;gap:8px;margin-top:8px}.overview-actions .btn{flex:1;padding:9px 10px;font-size:11px}.view-hidden{display:none!important}@media(min-width:700px){.mobile-tabs{max-width:420px}.overview-plan{padding:14px}}

<body>
  <header class="mobile-head">
    <div class="brand-mini"><img src="./altez-icon.svg" alt=""><div><strong>ALTEZ Werfapp</strong><span id="projectName">Project laden…</span></div></div>
    <button class="btn secondary" id="settingsBtn">Instellingen</button>
  </header>
  <main class="field-main">
    <div class="mobile-tabs">
      <button type="button" class="mobile-tab active" data-view="today">Vandaag</button>
      <button type="button" class="mobile-tab" data-view="planning">Planning</button>
    </div>
    <section id="view-today">
    <div class="date-nav card">
      <button class="date-arrow" id="prevDay">←</button>
      <button class="date-center" id="pickDate"><strong id="dayLabel">Vandaag</strong><span id="dateLabel"></span></button>
      <button class="date-arrow" id="nextDay">→</button>
      <input type="date" id="dateInput" class="hidden">
    </div>
    <div id="offlineBanner" class="offline hidden">Offline — wijzigingen worden bewaard en later gesynchroniseerd.</div>
    <section id="summary" class="summary-grid"></section>
    <section id="dailyQuantities" class="daily-qty"></section>
    <section id="planList"></section>
    </section>

    <section id="view-planning" class="view-hidden">
      <div class="card overview-toolbar">
        <div class="overview-toolbar-top"><strong>Komende planning</strong><button type="button" class="btn secondary" id="fieldPdfBtn">PDF</button></div>
        <div class="range-buttons" id="fieldRange">
          <button type="button" class="range-btn" data-range="7">7 dagen</button>
          <button type="button" class="range-btn active" data-range="30">30 dagen</button>
          <button type="button" class="range-btn" data-range="all">Alles</button>
        </div>
      </div>
      <div id="overviewList"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-head"><h2>Werfapp instellingen</h2><button value="cancel" class="close">×</button></div>
      <label>Naam ploegbaas<input id="workerName" placeholder="Naam"></label>
      <label>Project<select id="projectSelect"></select></label>
      <div class="dialog-actions"><button value="cancel" class="btn secondary">Annuleren</button><button value="default" class="btn primary" id="saveSettings">Opslaan</button></div>
    </form>
  </dialog>

  <script>
(function(){
  const KEY='altez_dagplanning_github_db_v1';
  const now=()=>new Date().toISOString();
  const uid=p=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
  const clone=o=>JSON.parse(JSON.stringify(o));
  const seed={
    projects:[{id:'demo-project',trimbleProjectId:'',name:'Project Test - Haven Antwerpen',active:true}],
    categories:[
      {id:'steel',name:'Staal',color:'#a9d18e',textColor:'#17320d',defaultUnit:'kg'},
      {id:'concrete',name:'Betonwanden',color:'#ffc000',textColor:'#3b2b00',defaultUnit:'m²'},
      {id:'facade',name:'Gevelwanden',color:'#7fb3e6',textColor:'#0f2d4a',defaultUnit:'m²'},
      {id:'slabs',name:'Welfsels',color:'#7fb3e6',textColor:'#0f2d4a',defaultUnit:'m²'},
      {id:'silex',name:'Silex',color:'#fff97d',textColor:'#3f3a00',defaultUnit:'m²'},
      {id:'hydroos',name:'Hydroos onroerend goed',color:'#e9ecef',textColor:'#2f3438',defaultUnit:'st'},
      {id:'material',name:'Magazijnmateriaal',color:'#d9e2f3',textColor:'#26354a',defaultUnit:'st'},
      {id:'other',name:'Andere',color:'#dedede',textColor:'#333333',defaultUnit:'st'}
    ],
    plans:[
      {id:'plan_today_steel',projectId:'demo-project',date:'2026-09-15',categoryId:'steel',title:'Staal V5 + V6',notes:'',deliveries:[
        {id:'del_today_v5',code:'V5',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null},
        {id:'del_today_v6',code:'V6',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null}
      ],createdAt:'2026-09-14T08:00:00.000Z',updatedAt:'2026-09-14T08:00:00.000Z'},
      {id:'plan_today_concrete',projectId:'demo-project',date:'2026-09-15',categoryId:'concrete',title:'Betonwanden V11 + V12',notes:'',deliveries:[
        {id:'del_today_v11',code:'V11',deliveredAt:'2026-09-15T06:45:00.000Z',deliveredBy:'Ploegbaas Demo',mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null},
        {id:'del_today_v12',code:'V12',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null}
      ],createdAt:'2026-09-14T08:00:00.000Z',updatedAt:'2026-09-15T06:45:00.000Z'},
      {id:'plan_steel_1',projectId:'demo-project',date:'2026-09-18',categoryId:'steel',title:'Staal V1 + 2 + magazijnmateriaal',notes:'',deliveries:[
        {id:'del_v1',code:'V1',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null},
        {id:'del_v2',code:'V2',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null}
      ],createdAt:'2026-09-10T08:00:00.000Z',updatedAt:'2026-09-10T08:00:00.000Z'},
      {id:'plan_silex_1',projectId:'demo-project',date:'2026-09-22',categoryId:'silex',title:'Silex V1',notes:'',deliveries:[
        {id:'del_silex1',code:'V1',deliveredAt:'2026-09-22T06:58:00.000Z',deliveredBy:'Ploegbaas Demo',mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null}
      ],createdAt:'2026-09-10T08:00:00.000Z',updatedAt:'2026-09-22T06:58:00.000Z'},
      {id:'plan_concrete_1',projectId:'demo-project',date:'2026-09-22',categoryId:'concrete',title:'Betonwanden V1 + 2 + 6',notes:'',deliveries:[
        {id:'del_b1',code:'V1',deliveredAt:'2026-09-22T07:30:00.000Z',deliveredBy:'Ploegbaas Demo',mountedAt:'2026-09-22T10:45:00.000Z',mountedBy:'Ploegbaas Demo',issue:null,issueAt:null,issueBy:null},
        {id:'del_b2',code:'V2',deliveredAt:'2026-09-22T09:12:00.000Z',deliveredBy:'Ploegbaas Demo',mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null},
        {id:'del_b6',code:'V6',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:'Levering 1 uur vertraagd',issueAt:'2026-09-22T09:20:00.000Z',issueBy:'Ploegbaas Demo'}
      ],createdAt:'2026-09-10T08:00:00.000Z',updatedAt:'2026-09-22T09:20:00.000Z'},
      {id:'plan_facade_1',projectId:'demo-project',date:'2026-09-24',categoryId:'facade',title:'Gevelwanden V101 + 102 + 103 + 104 + 105',notes:'',deliveries:['V101','V102','V103','V104','V105'].map((code,i)=>({id:`del_f10${i+1}`,code,deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null})),createdAt:'2026-09-10T08:00:00.000Z',updatedAt:'2026-09-10T08:00:00.000Z'},
      {id:'plan_facade_2',projectId:'demo-project',date:'2026-09-25',categoryId:'facade',title:'Gevelwanden V201',notes:'',deliveries:[{id:'del_f201',code:'V201',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null}],createdAt:'2026-09-10T08:00:00.000Z',updatedAt:'2026-09-10T08:00:00.000Z'},
      {id:'plan_steel_4',projectId:'demo-project',date:'2026-09-25',categoryId:'steel',title:'Staal V4',notes:'',deliveries:[{id:'del_s4',code:'V4',deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null}],createdAt:'2026-09-10T08:00:00.000Z',updatedAt:'2026-09-10T08:00:00.000Z'}
    ],
    events:[]
  };
  function guessUnit(c){const n=String(c?.name||'').toLowerCase();if(n.includes('staal'))return 'kg';if(n.includes('wand')||n.includes('welf')||n.includes('gevel')||n.includes('silex')||n.includes('plaat'))return 'm²';return 'st'}
  function normalizeDb(db){db.projects=Array.isArray(db.projects)?db.projects:[];db.categories=Array.isArray(db.categories)?db.categories:[];db.plans=Array.isArray(db.plans)?db.plans:[];db.events=Array.isArray(db.events)?db.events:[];for(const c of db.categories){if(!c.defaultUnit)c.defaultUnit=guessUnit(c)}for(const p of db.plans){p.deliveries=Array.isArray(p.deliveries)?p.deliveries:[];const c=db.categories.find(x=>x.id===p.categoryId);for(const d of p.deliveries){if(d.quantity===undefined)d.quantity=null;if(!d.unit)d.unit=c?.defaultUnit||guessUnit(c)}}return db}
  function load(){
    try{const raw=localStorage.getItem(KEY);if(raw){const db=normalizeDb(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(db));return db}}catch(e){}
    const db=normalizeDb(clone(seed));save(db);return db;
  }
  function save(db){localStorage.setItem(KEY,JSON.stringify(db));window.dispatchEvent(new CustomEvent('altez-store-changed'))}
  function audit(db,e){db.events.unshift({id:uid('evt'),at:now(),...e});db.events=db.events.slice(0,1000)}
  function body(opts){if(!opts||opts.body==null)return {};if(typeof opts.body==='string')return JSON.parse(opts.body||'{}');return opts.body}
  function response(v){return Promise.resolve(clone(v))}
  function api(rawUrl,opts={}){
    const method=(opts.method||'GET').toUpperCase();
    const url=new URL(rawUrl,location.origin);let db=load();
    if(method==='GET'&&url.pathname==='/api/projects')return response(db.projects);
    if(method==='GET'&&url.pathname==='/api/categories')return response(db.categories);
    if(method==='POST'&&url.pathname==='/api/projects/ensure'){
      const b=body(opts);let p=db.projects.find(x=>x.trimbleProjectId&&x.trimbleProjectId===b.trimbleProjectId);
      if(!p){p={id:uid('prj'),trimbleProjectId:b.trimbleProjectId||'',name:b.name||'Trimble project',active:true};db.projects.push(p);audit(db,{projectId:p.id,type:'project_linked',message:`Trimble project gekoppeld: ${p.name}`,user:b.user||'Trimble Connect'});save(db)}
      return response(p);
    }
    if(method==='GET'&&url.pathname==='/api/plans'){
      let plans=db.plans.slice();const projectId=url.searchParams.get('projectId'),from=url.searchParams.get('from'),to=url.searchParams.get('to');
      if(projectId)plans=plans.filter(p=>p.projectId===projectId);if(from)plans=plans.filter(p=>p.date>=from);if(to)plans=plans.filter(p=>p.date<=to);
      plans.sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title));return response(plans);
    }
    if(method==='POST'&&url.pathname==='/api/plans'){
      const b=body(opts);const c=db.categories.find(x=>x.id===b.categoryId);const deliveries=(b.deliveries||[]).map(d=>({id:d.id||uid('del'),code:d.code,quantity:(d.quantity!==null&&d.quantity!==''&&Number.isFinite(Number(d.quantity)))?Number(d.quantity):null,unit:d.unit||c?.defaultUnit||'st',deliveredAt:d.deliveredAt||null,deliveredBy:d.deliveredBy||null,mountedAt:d.mountedAt||null,mountedBy:d.mountedBy||null,issue:d.issue||null,issueAt:d.issueAt||null,issueBy:d.issueBy||null}));
      const p={id:uid('plan'),projectId:b.projectId,date:b.date,categoryId:b.categoryId,title:(b.title||'').trim()||deliveries.map(d=>d.code).join(' + '),notes:(b.notes||'').trim(),deliveries,createdAt:now(),updatedAt:now()};db.plans.push(p);audit(db,{projectId:p.projectId,type:'plan_created',message:`${p.title} gepland op ${p.date}`,user:b.user||'Planner',entityId:p.id});save(db);return response(p);
    }
    const pm=url.pathname.match(/^\/api\/plans\/([^/]+)$/);
    if(pm&&method==='PUT'){
      const p=db.plans.find(x=>x.id===pm[1]);if(!p)return Promise.reject(new Error('Planning niet gevonden'));const b=body(opts);const before={date:p.date,title:p.title,categoryId:p.categoryId};
      if(b.date)p.date=b.date;if(b.categoryId)p.categoryId=b.categoryId;if(typeof b.title==='string')p.title=b.title.trim();if(typeof b.notes==='string')p.notes=b.notes.trim();
      if(Array.isArray(b.deliveries)){const old=new Map(p.deliveries.map(d=>[d.code,d]));p.deliveries=b.deliveries.map(d=>old.has(d.code)?{...old.get(d.code),...d}:{id:uid('del'),code:d.code,quantity:(d.quantity!==null&&d.quantity!==''&&Number.isFinite(Number(d.quantity)))?Number(d.quantity):null,unit:d.unit||(db.categories.find(c=>c.id===p.categoryId)?.defaultUnit||'st'),deliveredAt:null,deliveredBy:null,mountedAt:null,mountedBy:null,issue:null,issueAt:null,issueBy:null})}
      p.updatedAt=now();audit(db,{projectId:p.projectId,type:'plan_updated',message:before.date!==p.date?`${p.title} verplaatst: ${before.date} → ${p.date}`:`${p.title} aangepast`,user:b.user||'Planner',entityId:p.id});save(db);return response(p);
    }
    if(pm&&method==='DELETE'){
      const i=db.plans.findIndex(x=>x.id===pm[1]);if(i<0)return Promise.reject(new Error('Planning niet gevonden'));const [p]=db.plans.splice(i,1);const b=body(opts);audit(db,{projectId:p.projectId,type:'plan_deleted',message:`${p.title} verwijderd van ${p.date}`,user:b.user||'Planner',entityId:p.id});save(db);return response({ok:true});
    }
    const dm=url.pathname.match(/^\/api\/deliveries\/([^/]+)\/status$/);
    if(dm&&method==='POST'){
      const b=body(opts);let plan=null,d=null;for(const p of db.plans){const hit=p.deliveries.find(x=>x.id===dm[1]);if(hit){plan=p;d=hit;break}}if(!d)return Promise.reject(new Error('Vracht niet gevonden'));
      const user=b.user||'Ploegbaas',at=b.at||now();
      if(b.status==='delivered'){const v=b.value!==false;d.deliveredAt=v?at:null;d.deliveredBy=v?user:null;if(!v){d.mountedAt=null;d.mountedBy=null}audit(db,{projectId:plan.projectId,type:v?'delivered':'delivered_undone',message:`${d.code} ${v?'geleverd':'levering ongedaan gemaakt'}`,user,entityId:d.id})}
      else if(b.status==='mounted'){const v=b.value!==false;if(v&&!d.deliveredAt){d.deliveredAt=at;d.deliveredBy=user}d.mountedAt=v?at:null;d.mountedBy=v?user:null;audit(db,{projectId:plan.projectId,type:v?'mounted':'mounted_undone',message:`${d.code} ${v?'gemonteerd':'montage ongedaan gemaakt'}`,user,entityId:d.id})}
      else if(b.status==='issue'){d.issue=(b.message||'').trim()||null;d.issueAt=d.issue?at:null;d.issueBy=d.issue?user:null;audit(db,{projectId:plan.projectId,type:d.issue?'issue':'issue_cleared',message:d.issue?`${d.code}: probleem - ${d.issue}`:`${d.code}: probleem opgelost`,user,entityId:d.id})}
      plan.updatedAt=now();save(db);return response({plan,d});
    }
    if(method==='GET'&&url.pathname==='/api/events'){
      let e=db.events.slice();const p=url.searchParams.get('projectId'),limit=Math.min(Number(url.searchParams.get('limit')||100),500);if(p)e=e.filter(x=>x.projectId===p);return response(e.slice(0,limit));
    }
    if(method==='GET'&&url.pathname==='/api/dashboard'){
      const projectId=url.searchParams.get('projectId'),today=url.searchParams.get('date')||new Date().toISOString().slice(0,10);const plans=db.plans.filter(p=>!projectId||p.projectId===projectId);const deliveries=plans.flatMap(p=>p.deliveries.map(d=>({...d,date:p.date,planId:p.id,title:p.title,categoryId:p.categoryId})));const todayD=deliveries.filter(d=>d.date===today);const metrics={plannedToday:todayD.length,deliveredToday:todayD.filter(d=>d.deliveredAt||d.mountedAt).length,mountedToday:todayD.filter(d=>d.mountedAt).length,issuesOpen:deliveries.filter(d=>d.issue).length,overdue:deliveries.filter(d=>d.date<today&&!d.deliveredAt&&!d.mountedAt).length,totalPlanned:deliveries.length,totalDelivered:deliveries.filter(d=>d.deliveredAt||d.mountedAt).length,totalMounted:deliveries.filter(d=>d.mountedAt).length};return response({date:today,metrics,deliveries});
    }
    if(method==='POST'&&url.pathname==='/api/reset-demo'){db=clone(seed);save(db);return response({ok:true});}
    return Promise.reject(new Error('API endpoint niet gevonden'));
  }
  window.AltezStore={api,reset:()=>{save(clone(seed));location.reload()},key:KEY};
})();

</script>
  <script>
const state={projects:[],categories:[],projectId:null,date:new Date(),plans:[],overviewPlans:[],worker:localStorage.getItem('altez_worker')||'Ploegbaas Demo',view:'today',planningRange:'30'};
const $=s=>document.querySelector(s);
const api=(url,opts={})=>window.AltezStore.api(url,opts);
function isoDate(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function plusDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtTime(s){return s?new Date(s).toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'}):''}
function fmtQty(v,unit=''){if(v===null||v===undefined||!Number.isFinite(Number(v)))return '';return `${new Intl.NumberFormat('nl-BE',{maximumFractionDigits:2}).format(Number(v))}${unit?' '+unit:''}`}
function qtySummary(ds){const sums=new Map();for(const d of ds||[]){const q=Number(d.quantity);if(Number.isFinite(q)){const u=d.unit||'st';sums.set(u,(sums.get(u)||0)+q)}}return [...sums.entries()].map(([u,v])=>fmtQty(v,u)).join(' + ')}
function cat(id){return state.categories.find(c=>c.id===id)||{name:'Andere',color:'#ddd'}}
function planDisplayTitle(pl){const c=cat(pl.categoryId);return `${c.name} ${(pl.deliveries||[]).map(d=>d.code).join(' + ')}`.trim()}
function project(){return state.projects.find(p=>p.id===state.projectId)}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg,err=false){const e=document.createElement('div');e.className='toast'+(err?' error':'');e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function queue(){return JSON.parse(localStorage.getItem('altez_offline_queue')||'[]')}
function saveQueue(q){localStorage.setItem('altez_offline_queue',JSON.stringify(q))}
async function postStatus(deliveryId,payload){
  try{return await api(`/api/deliveries/${deliveryId}/status`,{method:'POST',body:JSON.stringify(payload)})}
  catch(e){if(!navigator.onLine||e instanceof TypeError){const q=queue();q.push({deliveryId,payload:{...payload,at:new Date().toISOString()}});saveQueue(q);toast('Offline opgeslagen. Wordt later gesynchroniseerd.');return null}throw e}
}
async function flushQueue(){if(!navigator.onLine)return;const q=queue();if(!q.length)return;const remain=[];for(const item of q){try{await api(`/api/deliveries/${item.deliveryId}/status`,{method:'POST',body:JSON.stringify(item.payload)})}catch(e){remain.push(item)}}saveQueue(remain);if(remain.length===0){toast('Offline wijzigingen gesynchroniseerd');await load()}}
async function boot(){
  state.categories=await api('/api/categories');state.projects=await api('/api/projects');
  const q=new URLSearchParams(location.search);const requested=q.get('project')||localStorage.getItem('altez_project');state.projectId=state.projects.some(p=>p.id===requested)?requested:state.projects[0]?.id;
  $('#workerName').value=state.worker;$('#projectSelect').innerHTML=state.projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');$('#projectSelect').value=state.projectId;
  wire();updateOnline();await load();await loadOverview();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);flushQueue();
}
async function load(){const ds=isoDate(state.date);state.plans=await api(`/api/plans?projectId=${encodeURIComponent(state.projectId)}&from=${ds}&to=${ds}`);render()}
async function loadOverview(){const from=isoDate(new Date());let url=`/api/plans?projectId=${encodeURIComponent(state.projectId)}&from=${from}`;if(state.planningRange!=='all')url+=`&to=${isoDate(plusDays(new Date(),Number(state.planningRange)))}`;state.overviewPlans=await api(url);renderOverview()}
function render(){const p=project();$('#projectName').textContent=p?.name||'';const ds=isoDate(state.date),today=isoDate(new Date());$('#dayLabel').textContent=ds===today?'Vandaag':state.date.toLocaleDateString('nl-BE',{weekday:'long'});$('#dateLabel').textContent=state.date.toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'});$('#dateInput').value=ds;const dels=state.plans.flatMap(pl=>pl.deliveries.map(d=>({...d,plan:pl})));$('#summary').innerHTML=`<div class="card sum-card"><div class="num">${dels.length}</div><div class="lbl">gepland</div></div><div class="card sum-card"><div class="num">${dels.filter(d=>d.deliveredAt||d.mountedAt).length}</div><div class="lbl">geleverd</div></div><div class="card sum-card"><div class="num">${dels.filter(d=>d.mountedAt).length}</div><div class="lbl">gemonteerd</div></div>`;
  const qGroups=new Map();for(const d of dels){const q=Number(d.quantity);if(Number.isFinite(q)){const c=cat(d.plan.categoryId),key=`${d.plan.categoryId}|${d.unit||c.defaultUnit||'st'}`;if(!qGroups.has(key)){qGroups.set(key,{name:c.name,color:c.color,unit:d.unit||c.defaultUnit||'st',value:0})}qGroups.get(key).value+=q}}$('#dailyQuantities').innerHTML=[...qGroups.values()].map(g=>`<span class="daily-qty-chip"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${g.color};margin-right:5px"></i>${escapeHtml(g.name)}: ${escapeHtml(fmtQty(g.value,g.unit))}</span>`).join('');
  const grouped=new Map();for(const pl of state.plans){if(!grouped.has(pl.categoryId))grouped.set(pl.categoryId,[]);grouped.get(pl.categoryId).push(pl)};const root=$('#planList');root.innerHTML='';if(!state.plans.length){root.innerHTML='<div class="card empty">Geen vrachten gepland voor deze dag.</div>';return}
  for(const [cid,plans] of grouped){const c=cat(cid),sec=document.createElement('div');sec.className='plan-block';sec.innerHTML=`<div class="category-head"><i class="category-dot" style="background:${c.color}"></i>${escapeHtml(c.name)}</div>`;for(const pl of plans){for(const d of pl.deliveries)sec.appendChild(deliveryCard(d,pl))}root.appendChild(sec)}
}
function deliveryCard(d,pl){const el=document.createElement('div');el.className='card delivery';const q=fmtQty(d.quantity,d.unit);el.innerHTML=`<div class="delivery-top"><div><div class="delivery-code">${escapeHtml(d.code)}</div><div class="delivery-title">${escapeHtml(cat(pl.categoryId).name)}</div>${pl.notes?`<div class="plan-note">${escapeHtml(pl.notes)}</div>`:''}${q?`<div class="quantity-badge">${escapeHtml(q)}</div>`:''}</div><div class="status-note">${d.mountedAt?`Gemonteerd ${fmtTime(d.mountedAt)}`:d.deliveredAt?`Geleverd ${fmtTime(d.deliveredAt)}`:'Nog niet geleverd'}</div></div><div class="actions"><button class="big-action deliver ${(d.deliveredAt||d.mountedAt)?'done':''}">${(d.deliveredAt||d.mountedAt)?'✓ Geleverd':'Geleverd'}</button><button class="big-action mount ${d.mountedAt?'done':''}">${d.mountedAt?'✓ Gemonteerd':'Gemonteerd'}</button></div><div class="issue-row"><button class="issue-btn">${d.issue?'Probleem aanpassen':'⚠ Probleem melden'}</button></div>${d.issue?`<div class="issue-text">⚠ ${escapeHtml(d.issue)}</div>`:''}`;
  el.querySelector('.deliver').onclick=async()=>{const value=!d.deliveredAt;if(!value&&!confirm(`${d.code}: levering ongedaan maken?`))return;await change(d,'delivered',value)};el.querySelector('.mount').onclick=async()=>{const value=!d.mountedAt;if(!value&&!confirm(`${d.code}: montage ongedaan maken?`))return;await change(d,'mounted',value)};el.querySelector('.issue-btn').onclick=async()=>{const msg=prompt(`${d.code} - probleem/opmerking${d.issue?' (leegmaken om te wissen)':''}`,d.issue||'');if(msg===null)return;await change(d,'issue',true,msg)};return el
}

function setView(view){state.view=view;$('#view-today').classList.toggle('view-hidden',view!=='today');$('#view-planning').classList.toggle('view-hidden',view!=='planning');document.querySelectorAll('.mobile-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='planning')loadOverview()}
function renderOverview(){const root=$('#overviewList');if(!root)return;document.querySelectorAll('#fieldRange .range-btn').forEach(b=>b.classList.toggle('active',b.dataset.range===state.planningRange));if(!state.overviewPlans.length){root.innerHTML='<div class="card empty">Geen toekomstige planning in deze periode.</div>';return}const byDate=new Map();for(const pl of state.overviewPlans){if(!byDate.has(pl.date))byDate.set(pl.date,[]);byDate.get(pl.date).push(pl)}root.innerHTML=[...byDate.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([ds,plans])=>{const dt=parseDate(ds);const count=plans.reduce((n,p)=>n+p.deliveries.length,0);return `<section class="overview-day"><div class="overview-date"><strong>${dt.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'})}</strong><span>${count} vracht${count===1?'':'en'}</span></div>${plans.map(pl=>{const c=cat(pl.categoryId),dels=pl.deliveries,del=dels.filter(d=>d.deliveredAt||d.mountedAt).length,mnt=dels.filter(d=>d.mountedAt).length,issues=dels.filter(d=>d.issue).length,q=qtySummary(dels);return `<div class="card overview-plan" style="border-left-color:${c.color}"><div class="overview-plan-title">${escapeHtml(planDisplayTitle(pl))}</div>${pl.notes?`<div class="overview-plan-note">${escapeHtml(pl.notes)}</div>`:''}${q?`<div class="overview-qty">${escapeHtml(q)}</div>`:''}<div class="overview-plan-meta"><span class="overview-chip">🚚 ${del}/${dels.length}</span><span class="overview-chip">🔧 ${mnt}/${dels.length}</span>${issues?`<span class="overview-chip">⚠ ${issues}</span>`:''}</div><div class="overview-deliveries">${dels.map(d=>`<span class="overview-delivery ${d.mountedAt?'mount':d.deliveredAt?'done':''}">${escapeHtml(d.code)}${d.quantity!==null&&d.quantity!==undefined?' · '+escapeHtml(fmtQty(d.quantity,d.unit)):''}</span>`).join('')}</div><div class="overview-actions"><button type="button" class="btn secondary go-day" data-date="${ds}">Open dag</button></div></div>`}).join('')}</section>`}).join('');root.querySelectorAll('.go-day').forEach(b=>b.onclick=async()=>{state.date=parseDate(b.dataset.date);setView('today');await load()})}
function exportFieldPlanningPDF(){const p=project(),plans=state.overviewPlans;if(!plans.length)return toast('Geen planning om te exporteren.',true);const byDate=new Map();for(const pl of plans){if(!byDate.has(pl.date))byDate.set(pl.date,[]);byDate.get(pl.date).push(pl)}const body=[...byDate.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([ds,pls])=>{const d=parseDate(ds);return `<section><h2>${d.toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${pls.map(pl=>{const c=cat(pl.categoryId),q=qtySummary(pl.deliveries),del=pl.deliveries.filter(x=>x.deliveredAt||x.mountedAt).length,mnt=pl.deliveries.filter(x=>x.mountedAt).length;return `<div class="pc" style="border-left-color:${c.color}"><strong>${escapeHtml(planDisplayTitle(pl))}</strong>${pl.notes?`<div class="note">${escapeHtml(pl.notes)}</div>`:''}${q?`<div class="q">${escapeHtml(q)}</div>`:''}<div class="m">${pl.deliveries.map(x=>escapeHtml(x.code)).join(', ')} · geleverd ${del}/${pl.deliveries.length} · gemonteerd ${mnt}/${pl.deliveries.length}</div></div>`}).join('')}</section>`}).join('');const w=window.open('','_blank');if(!w)return toast('Popup geblokkeerd.',true);w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(p?.name||'ALTEZ Werfplanning')}</title><style>@page{size:A3 landscape;margin:12mm}body{font-family:Arial,sans-serif;color:#172b3f}h1{font-size:19px;margin:0}.sub{font-size:10px;color:#66788a;margin:4px 0 12px}h2{font-size:13px;background:#eef2f5;padding:6px;margin:10px 0 5px}.pc{border:1px solid #dbe3ea;border-left:6px solid #0b5fa5;border-radius:6px;padding:8px;margin-bottom:6px;break-inside:avoid}.pc strong{font-size:12px}.note{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:9.5px;color:#52606d;margin-top:4px;padding-left:6px;border-left:1.5px solid #cbd5df}.q{font-size:11px;font-weight:700;margin-top:4px}.m{font-size:9px;color:#52606d;margin-top:5px}</style></head><body><h1>${escapeHtml(p?.name||'ALTEZ Werfplanning')}</h1><div class="sub">Komende planning · ${state.planningRange==='all'?'alles':state.planningRange+' dagen'} · ${new Date().toLocaleString('nl-BE')}</div>${body}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}

async function change(d,status,value,message=''){try{const r=await postStatus(d.id,{status,value,message,user:state.worker});if(r){await load();if(state.view==='planning')await loadOverview()}else{if(status==='delivered'){d.deliveredAt=value?new Date().toISOString():null;if(!value)d.mountedAt=null}else if(status==='mounted'){if(value&&!d.deliveredAt)d.deliveredAt=new Date().toISOString();d.mountedAt=value?new Date().toISOString():null}else if(status==='issue'){d.issue=message||null}render()}}catch(e){toast(e.message,true)}}
function wire(){
  document.querySelectorAll('.mobile-tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.querySelectorAll('#fieldRange .range-btn').forEach(b=>b.onclick=async()=>{state.planningRange=b.dataset.range;await loadOverview()});
  $('#fieldPdfBtn').onclick=exportFieldPlanningPDF;
  $('#prevDay').onclick=async()=>{state.date=plusDays(state.date,-1);await load()};$('#nextDay').onclick=async()=>{state.date=plusDays(state.date,1);await load()};$('#pickDate').onclick=()=>$('#dateInput').showPicker?$('#dateInput').showPicker():$('#dateInput').click();$('#dateInput').onchange=async e=>{state.date=parseDate(e.target.value);await load()};$('#settingsBtn').onclick=()=>$('#settingsDialog').showModal();$('#saveSettings').onclick=async e=>{e.preventDefault();state.worker=$('#workerName').value.trim()||'Ploegbaas';state.projectId=$('#projectSelect').value;localStorage.setItem('altez_worker',state.worker);localStorage.setItem('altez_project',state.projectId);$('#settingsDialog').close();await load();await loadOverview()};window.addEventListener('online',()=>{updateOnline();flushQueue()});window.addEventListener('offline',updateOnline);window.addEventListener('altez-store-changed',()=>{load().catch(()=>{});loadOverview().catch(()=>{})});window.addEventListener('storage',e=>{if(e.key===window.AltezStore.key){load().catch(()=>{});loadOverview().catch(()=>{})}});setInterval(()=>{load().catch(()=>{});if(state.view==='planning')loadOverview().catch(()=>{})},20000)
}
function updateOnline(){$('#offlineBanner').classList.toggle('hidden',navigator.onLine);}
boot().catch(e=>{console.error(e);toast(e.message,true)});

</script>
